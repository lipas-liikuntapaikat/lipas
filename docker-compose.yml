# Service profiles:
#   (none)  — runtime services + jar-based one-offs; this is all the servers
#             ever run. Runtime code comes from the installed artifacts
#             (webapp/backend.jar, resources/public/) — servers never compile
#             from source. See scripts/deploy/install.sh.
#   dev     — local-development-only services (source-based, watch/test/seed)
#   build   — dockerized build steps (used by local dev; CI builds on
#             GitHub-hosted runners via .github/actions/build-artifacts)
# Explicitly targeting a profiled service (docker compose run/up <name>)
# activates its profile automatically — no --profile flag needed.

services:

  proxy-base:
    # Stock nginx + ngx_brotli dynamic modules (see nginx/Dockerfile).
    # Built on each host, not pulled: docker compose build proxy|proxy-dev|proxy-local
    build: ./nginx
    image: lipas/proxy
    environment:
      DIGITRANSIT_SUBSCRIPTION_KEY:
    ports:
      - '80:80'
      - '443:443'
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://localhost:5000"
        tag: "proxy"
    volumes:
      - './certs/:/certs:z'
      - './webapp/resources/public/:/usr/share/nginx/html:z'
      - './nginx/nginx.conf:/etc/nginx/nginx.conf:z'
      - './nginx/htpasswd:/etc/nginx/htpasswd:z'

  proxy:
    extends:
      service: proxy-base
    depends_on:
      backend:
        condition: service_healthy
    links:
      - mapproxy
      - backend
      - logstash
      - kibana
      - geoserver
    volumes:
      - './nginx/proxy.conf:/etc/nginx/templates/default.conf.template:z'

  # Only difference is added X-Robots-tag 'noindex'
  # to make search engines ignore dev-site(s)
  proxy-dev:
    extends:
      service: proxy-base
    depends_on:
      backend:
        condition: service_healthy
    links:
      - mapproxy
      - backend
      - logstash
      - kibana
      - geoserver
    volumes:
      - './nginx/proxy_dev.conf:/etc/nginx/templates/default.conf.template:z'

  proxy-local:
    extends:
      service: proxy-base
    profiles: ["dev"]
    ports:
      - '80:80'
      - '443:443'
      - '444:444'
      - '8025:8025'
      - '8082:8082'  # Test port for lipas.cc.jyu.fi /api/* pattern
    links:
      - mapproxy
      - logstash
      - kibana
      - geoserver
      - mailhog
    volumes:
      - './nginx/proxy_local.conf:/etc/nginx/templates/default.conf.template:z'

  htpasswd:
    image: lipas/htpasswd
    build:
      context: ./htpasswd
      dockerfile: Dockerfile

  mapproxy:
    image: ghcr.io/mapproxy/mapproxy/mapproxy:1.16.0-nginx
    platform: linux/amd64  # Official image only supports amd64
    hostname: mapproxy
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://localhost:5000"
        tag: "mapproxy"
    environment:
      TZ: Europe/Helsinki
      MML_AUTH:
    entrypoint: ["/bin/bash", "/mapproxy/config/docker-entrypoint.sh"]
    volumes:
      - './mapproxy/mapproxy_template.yaml:/mapproxy/config/mapproxy_template.yaml:ro,z'
      - './mapproxy/docker-entrypoint.sh:/mapproxy/config/docker-entrypoint.sh:ro,z'
      - './mapproxy/mml_cleanup.yaml:/mapproxy/config/mml_cleanup.yaml:ro,z'
      - './mapproxy/purge.sh:/mapproxy/config/purge.sh:ro,z'
      - 'mapproxy_cache:/mapproxy/config/cache_data'

  backend-base:
    image: clojure:temurin-21-tools-deps
    working_dir: /usr/src/app
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://localhost:5000"
        tag: "backend"
    environment:
      DB_HOST:
      DB_PORT:
      DB_NAME:
      DB_USER:
      DB_PASSWORD:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_USER:
      SMTP_PASS:
      SMTP_FROM:
      SEARCH_HOST:
      SEARCH_USER:
      SEARCH_PASS:
      OLD_LIPAS_USER:
      OLD_LIPAS_PASS:
      ADMIN_PASSWORD:
      ACCESSIBILITY_REGISTER_BASE_URL:
      ACCESSIBILITY_REGISTER_SYSTEM_ID:
      ACCESSIBILITY_REGISTER_SECRET_KEY:
      OSRM_CAR_URL:
      OSRM_BICYCLE_URL:
      OSRM_FOOT_URL:
      MAILCHIMP_CAMPAIGN_FOLDER_ID:
      MAILCHIMP_LIST_ID:
      MAILCHIMP_NEWSLETTER_INTEREST_ID:
      MAILCHIMP_API_URL:
      MAILCHIMP_API_KEY:
      MML_COVERAGE_URL:
      MML_API_KEY:
      UTP_CMS_API_URL:
      UTP_CMS_API_USER:
      UTP_CMS_API_PASS:
      UTP_WEBHOOK_SOURCE_ENV:
      UTP_WEBHOOK_URL:
      UTP_WEBHOOK_SUBSCRIPTION_KEY:
      UTP_WEBHOOK_TOKEN_CLIENT_ID:
      UTP_WEBHOOK_TOKEN_CLIENT_SECRET:
      UTP_WEBHOOK_TOKEN_URL:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_REGION:
      AWS_S3_BUCKET:
      AWS_S3_BUCKET_PREFIX:
      PTV_API_URL:
      PTV_TOKEN_URL:
      PTV_SERVICE_URL:
      PTV_SERVICE_LOCATION_URL:
      PTV_ORG_ID:
      PTV_API_USERNAME:
      PTV_API_PASSWORD:
      PTV_ENV:
      OPEN_AI_API_KEY:
      GEMINI_API_KEY:
      GEOSERVER_ADMIN_PASSWORD:
      GEOSERVER_ADMIN_USER:
      ENVIRONMENT:
      # Worker configuration (via environment variables)
      WORKER_FAST_THREADS: 2
      WORKER_GENERAL_THREADS: 2
    volumes:
      - './webapp/:/usr/src/app:z'
      - 'mvn_cache:/root/.m2'

  backend:
    extends:
      service: backend-base
    command: java -Duser.timezone=UTC -Xmx2G -jar backend.jar -m lipas.backend.system server
    healthcheck:
      test: ["CMD-SHELL", "java healthcheck.java http://localhost:8091/api/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - '8091:8091'
      # nREPL is unauthenticated arbitrary code execution in the backend JVM,
      # so it is published on the HOST LOOPBACK only. A bare '7888:7888' binds
      # every host interface, and Docker's own iptables rules sit in front of
      # ufw — a host firewall does not necessarily cover a published port.
      #
      # Reach it the way we already do: ssh -L 7888:localhost:7888 lipas-prod
      # (the tunnel terminates on the host's loopback, so this still works).
      #
      # The nREPL server itself must keep binding 0.0.0.0 INSIDE the container
      # (lipas.backend.config) — that is the container's own network namespace,
      # and Docker cannot forward a published port to a container-loopback
      # listener.
      - '127.0.0.1:7888:7888'
    links:
      - postgres
      - elasticsearch
      - osrm-car
      - osrm-bicycle
      - osrm-foot

  backend-dev:
    extends:
      service: backend-base
    profiles: ["dev"]
    command: clojure -M:dev -m lipas.backend.system
    hostname: backend
    ports:
      - '8091:8091'
      # Loopback-only, same reasoning as the `backend` service above.
      - '127.0.0.1:7888:7888'
    links:
      - postgres
      - elasticsearch
      - osrm-car
      - osrm-bicycle
      - osrm-foot

  backend-build:
    extends:
      service: backend-base
    profiles: ["build"]
    command: clojure -T:build uber

  # Runs from the installed uberjar — servers never compile from source.
  # Fresh dev setups (no jar yet) use backend-migrate-dev below.
  backend-migrate:
    extends:
      service: backend-base
    command: java -jar backend.jar -m lipas.migrate-db migrate
    links:
      - postgres

  backend-migrate-dev:
    extends:
      service: backend-base
    profiles: ["dev"]
    command: clojure -M:migrate migrate
    links:
      - postgres

  backend-tests:
    extends:
      service: backend-base
    profiles: ["dev"]
    command: clojure -M:dev:test
    links:
      - postgres
      - elasticsearch

  backend-seed:
    extends:
      service: backend-base
    profiles: ["dev"]
    command: clojure -M -m lipas.seed
    links:
      - postgres

  backend-maintenance:
    extends:
      service: backend-base
    logging:
      options:
        tag: "maintenance"
    entrypoint: java -jar backend.jar -m lipas.maintenance
    links:
      - postgres

  backend-index-search:
    extends:
      service: backend-base
    logging:
      options:
        tag: "search-indexer"
    entrypoint: java -jar backend.jar -m lipas.search-indexer
    links:
      - postgres
      - elasticsearch
      - osrm-foot
      - osrm-bicycle
      - osrm-car

  backend-refresh-wfs:
    extends:
      service: backend-base
    entrypoint: java -jar backend.jar -m lipas.wfs.core
    links:
      - postgres

  worker-local:
    extends:
      service: backend-base
    profiles: ["dev"]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    entrypoint: clojure -M -m lipas.backend.system worker
    links:
      - postgres
      - elasticsearch
      - osrm-foot
      - osrm-bicycle
      - osrm-car

  # uberjar for production deployments
  worker:
    extends:
      service: backend-base
    restart: unless-stopped
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://localhost:5000"
        tag: "worker-v2"
    command: java -Duser.timezone=UTC -Xmx12G -jar backend.jar -m lipas.backend.system worker
    links:
      - postgres
      - elasticsearch
      - osrm-foot
      - osrm-bicycle
      - osrm-car

  node-base:
    image: node:16-alpine
    working_dir: /usr/src/app
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://localhost:5000"
        tag: "backend-node"
    volumes:
      - './webapp/:/usr/src/app:z'

  frontend-npm-deps:
    extends:
      service: node-base
    profiles: ["build"]
    command: npm install --quiet

  # Writes .br/.gz siblings next to the release bundles for nginx
  # brotli_static/gzip_static. Run after frontend-build.
  frontend-precompress:
    extends:
      service: node-base
    profiles: ["build"]
    command: node scripts/precompress.mjs

  frontend-build:
    extends:
      service: backend-base
    profiles: ["build"]
    # :frontend alias carries shadow-cljs & cljs deps; this direct clojure
    # invocation bypasses the npm launcher, so shadow-cljs.edn's :deps
    # aliases don't apply here
    command: clojure -M:frontend:dev -m shadow.cljs.devtools.cli release app

  postgres:
    image: postgis/postgis:17-3.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${DB_SUPERUSER}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
      DB_PORT: 5432
      DB_NAME:
      DB_USER:
      DB_PASSWORD:
      DB_SUPERUSER:
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:z

  elasticsearch:
    # Stock Elasticsearch + analysis-icu plugin (locale-correct name sorting).
    # See elasticsearch/Dockerfile. Rebuild with: docker compose build elasticsearch
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    image: lipas/elasticsearch:8.19.9-icu
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '9200:9200'
      - '9300:9300'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.monitoring.collection.enabled=false
      - xpack.ml.enabled=false
      - xpack.graph.enabled=false
      - xpack.watcher.enabled=false
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS}"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  # One-shot container to apply Elasticsearch configuration (ILM policies, etc.)
  elasticsearch-setup:
    image: curlimages/curl:8.11.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - "./elasticsearch/setup:/setup:z"
    environment:
      - ES_HOST=elasticsearch:9200
    entrypoint: ["/bin/sh", "/setup/init.sh"]
    restart: "no"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.9
    ports:
      - "5000:5000/udp"
    environment:
      - xpack.monitoring.enabled=false
    links:
      - elasticsearch
    volumes:
      - "./logstash/pipeline:/usr/share/logstash/pipeline:z"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.9
    ports:
      - "5601:5601"
    environment:
      - xpack.monitoring.enabled=false
    links:
      - elasticsearch
    volumes:
      - "./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:z"

  geoserver:
    image: docker.osgeo.org/geoserver:2.26.2
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://localhost:5000"
        tag: "geoserver"
    ports:
      - "8888:8080"
    environment:
      GEOSERVER_DATA_DIR: "/my_data_dir"
      GEOWEBCACHE_CACHE_DIR: "/my_data_dir/gwc"
      GEOSERVER_ADMIN_PASSWORD:
      GEOSERVER_ADMIN_USER:
      EXTRA_JAVA_OPTS: "-Xms${GEOSERVER_INITIAL_MEMORY} -Xmx${GEOSERVER_MAX_MEMORY}"
      CORS_ENABLED: true
    links:
      - postgres
    volumes:
      - "./geoserver/data_dir:/my_data_dir:z"

  elasticdump:
    image: elasticdump/elasticsearch-dump
    links:
      - elasticsearch
    volumes:
      - "./data:/data:z"

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend
    restart: unless-stopped
    command: osrm-routed --max-table-size 3000 --algorithm mld /data/finland-latest.osrm
    volumes:
      - "./osrm/car:/data:z"
    ports:
      - "5001:5000"

  osrm-bicycle:
    image: ghcr.io/project-osrm/osrm-backend
    restart: unless-stopped
    command: osrm-routed --max-table-size 3000 --algorithm mld /data/finland-latest.osrm
    volumes:
      - "./osrm/bicycle:/data:z"
    ports:
      - "5002:5000"

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend
    restart: unless-stopped
    command: osrm-routed --max-table-size 3000 --algorithm mld /data/finland-latest.osrm
    volumes:
      - "./osrm/foot:/data:z"
    ports:
      - "5003:5000"

  mailhog:
    profiles: ["dev"]
    image: mailhog/mailhog
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://localhost:5000"
        tag: "mailhog"
    ports:
      - "1025:1025" # smtp server

volumes:
  pgdata: {}
  esdata: {}
  mvn_cache: {}
  mapproxy_cache: {}
