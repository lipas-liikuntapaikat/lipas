name: Deploy to lipas-dev

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to deploy (default: master)'
        required: false
        default: 'master'

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  DEPLOY_LABEL: lipas-dev
  ALLOWED_USERS: "vharmain"

jobs:
  plan:
    # Reject pull_request events from forks. The deploy job runs on a
    # self-hosted runner with access to /var/lipas — fork PRs must not
    # be able to trigger this. workflow_dispatch always uses the default
    # branch's workflow file and is unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
      ref:           ${{ steps.decide.outputs.ref }}
    steps:
      - name: Decide what to deploy
        id: decide
        env:
          EVENT:         ${{ github.event_name }}
          ACTION:        ${{ github.event.action }}
          LABEL_NAME:    ${{ github.event.label.name }}
          SENDER:        ${{ github.event.sender.login }}
          PR_HEAD_REF:   ${{ github.event.pull_request.head.ref }}
          PR_HAD_LABEL:  ${{ contains(github.event.pull_request.labels.*.name, 'lipas-dev') }}
          INPUT_REF:     ${{ inputs.ref }}
        run: |
          set -euo pipefail

          authorize() {
            if ! grep -qw "$SENDER" <<<"$ALLOWED_USERS"; then
              echo "::error::User '$SENDER' is not allowed to deploy to lipas-dev"
              exit 1
            fi
          }

          emit() {
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "ref=$1" >> "$GITHUB_OUTPUT"
            echo "Will deploy ref: $1"
          }

          case "$EVENT" in
            workflow_dispatch)
              authorize
              emit "$INPUT_REF"
              ;;
            pull_request)
              case "$ACTION" in
                labeled)
                  if [[ "$LABEL_NAME" == "$DEPLOY_LABEL" ]]; then
                    authorize
                    emit "$PR_HEAD_REF"
                  else
                    echo "should_deploy=false" >> "$GITHUB_OUTPUT"
                  fi
                  ;;
                unlabeled)
                  if [[ "$LABEL_NAME" == "$DEPLOY_LABEL" ]]; then
                    authorize
                    emit "master"
                  else
                    echo "should_deploy=false" >> "$GITHUB_OUTPUT"
                  fi
                  ;;
                synchronize)
                  # New commits on a labeled PR — keep dev tracking the head.
                  # Label is the gate, so no authorize() check on the pusher.
                  if [[ "$PR_HAD_LABEL" == "true" ]]; then
                    emit "$PR_HEAD_REF"
                  else
                    echo "should_deploy=false" >> "$GITHUB_OUTPUT"
                  fi
                  ;;
                closed)
                  if [[ "$PR_HAD_LABEL" == "true" ]]; then
                    emit "master"
                  else
                    echo "should_deploy=false" >> "$GITHUB_OUTPUT"
                  fi
                  ;;
                *)
                  echo "should_deploy=false" >> "$GITHUB_OUTPUT"
                  ;;
              esac
              ;;
            *)
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # Strip the deploy label from any other PRs so it stays exclusive to one PR.
  exclusive-label:
    needs: plan
    if: |
      needs.plan.outputs.should_deploy == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'lipas-dev'
    runs-on: ubuntu-latest
    steps:
      - name: Remove label from any other open PRs
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --label "$DEPLOY_LABEL" \
            --state open \
            --json number --jq '.[].number' \
          | while read -r n; do
              if [[ "$n" != "$PR_NUMBER" ]]; then
                echo "Removing $DEPLOY_LABEL from PR #$n"
                gh pr edit "$n" --repo "$GITHUB_REPOSITORY" --remove-label "$DEPLOY_LABEL"
              fi
            done

  # Build on GitHub-hosted CI — the dev host only installs artifacts. The
  # SHA is captured here so the install pins /var/lipas to exactly what was
  # built, even if the branch advances mid-flight.
  build:
    needs: plan
    if: needs.plan.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.build.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Build release artifacts
        id: build
        uses: ./.github/actions/build-artifacts
        with:
          upload: 'true'

  deploy:
    needs: [plan, exclusive-label, build]
    if: |
      always() &&
      needs.plan.outputs.should_deploy == 'true' &&
      needs.build.result == 'success' &&
      (needs.exclusive-label.result == 'success' || needs.exclusive-label.result == 'skipped')
    runs-on: [self-hosted, lipas-dev]
    timeout-minutes: 60
    environment:
      name: lipas-dev
      url: https://lipas-dev.cc.jyu.fi
    steps:
      # The installer runs from the workspace, not /var/lipas — it may check
      # out a different ref there, and a script must not change underneath
      # its own execution.
      - name: Check out installer at the built SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Install release
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          bash scripts/deploy/install.sh \
            --artifacts "${{ runner.temp }}/release" \
            --sha "$SHA" \
            --door github-dev \
            --reindex
