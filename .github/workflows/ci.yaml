name: LIPAS CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  AUTH_KEY: ${{ vars.AUTH_KEY }}
  ADMIN_PASSWORD: ${{ vars.ADMIN_PASSWORD }}
  SMTP_HOST: ${{ vars.SMTP_HOST }}
  SMTP_USER: ${{ vars.SMTP_USER }}
  SMTP_PORT: ${{ vars.SMTP_PORT }}
  SMTP_FROM: ${{ vars.SMTP_FROM }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  SEARCH_HOST: ${{ vars.SEARCH_HOST }}
  SEARCH_USER: ${{ vars.SEARCH_USER }}
  SEARCH_PASS: ${{ secrets.SEARCH_PASS }}
  ES_JAVA_OPTS: ${{ vars.ES_JAVA_OPTS }}
  DB_NAME: ${{ vars.DB_NAME }}
  DB_HOST: ${{ vars.DB_HOST }}
  DB_PORT: ${{ vars.DB_PORT }}
  DB_SUPERUSER: ${{ vars.DB_SUPERUSER }}
  DB_SUPERUSER_PASSWORD: ${{ secrets.DB_SUPERUSER_PASSWORD }}
  DB_USER: ${{ vars.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  MML_AUTH: ${{ secrets.MML_AUTH }}
  ACCESSIBILITY_REGISTER_BASE_URL: ${{ vars.ACCESSIBILITY_REGISTER_BASE_URL }}
  ACCESSIBILITY_REGISTER_SYSTEM_ID: ${{ vars.ACCESSIBILITY_REGISTER_SYSTEM_ID }}
  ACCESSIBILITY_REGISTER_SECRET_KEY: ${{ secrets.ACCESSIBILITY_REGISTER_SECRET_KEY }}
  LEGACY_DB_URL: ${{ vars.LEGACY_DB_URL }}
  LEGACY_DB_USER: ${{ vars.LEGACY_DB_USER }}
  LEGACY_DB_PASS: ${{ secrets.LEGACY_DB_PASS }}
  GEOSERVER_ADMIN_USER: ${{ vars.GEOSERVER_ADMIN_USER }}
  GEOSERVER_ADMIN_PASSWORD: ${{ secrets.GEOSERVER_ADMIN_PASSWORD }}
  GEOSERVER_INITIAL_MEMORY: ${{ vars.GEOSERVER_INITIAL_MEMORY }}
  GEOSERVER_MAX_MEMORY: ${{ vars.GEOSERVER_MAX_MEMORY}}
  OSRM_CAR_URL: ${{ vars.OSRM_CAR_URL }}
  OSRM_BICYCLE_URL: ${{ vars.OSRM_BICYCLE_URL }}
  OSRM_FOOT_URL: ${{ vars.OSRM_FOOT_URL }}
  MAILCHIMP_CAMPAIGN_FOLDER_ID: ${{ vars.MAILCHIMP_CAMPAIGN_FOLDER_ID }}
  MAILCHIMP_LIST_ID: ${{ vars.MAILCHIMP_LIST_ID }}
  MAILCHIMP_NEWSLETTER_INTEREST_ID: ${{ vars.MAILCHIMP_NEWSLETTER_INTEREST_ID }}
  MAILCHIMP_API_URL: ${{ vars.MAILCHIMP_API_URL }}
  MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
  DIGITRANSIT_SUBSCRIPTION_KEY: ${{ secrets.DIGITRANSIT_SUBSCRIPTION_KEY }}
  MML_COVERAGE_URL: ${{ vars.MML_COVERAGE_URL }}
  MML_API_KEY: ${{ secrets.MML_API_KEY }}
  AWS_ACCESS_KEY_ID: lol
  AWS_SECRET_ACCESS_KEY: lol
  AWS_REGION: 'eu-north-1'
  AWS_S3_BUCKET: lol
  AWS_S3_BUCKET_PREFIX: lol
  UTP_CMS_API_URL: "https://luontoon-fi-cms-test.druid.fi/fi/jsonapi"
  UTP_CMS_API_USER: lipas-developer
  UTP_CMS_API_PASS: password
  UTP_WEBHOOK_SOURCE_ENV: ${{ vars.UTP_WEBHOOK_SOURCE_ENV }}
  UTP_WEBHOOK_URL: ${{ vars.UTP_WEBHOOK_URL }}
  UTP_WEBHOOK_SUBSCRIPTION_KEY: ${{ secrets.UTP_WEBHOOK_SUBSCRIPTION_KEY }}
  UTP_WEBHOOK_TOKEN_CLIENT_ID: ${{ vars.UTP_WEBHOOK_TOKEN_CLIENT_ID }}
  UTP_WEBHOOK_TOKEN_CLIENT_SECRET: ${{ secrets.UTP_WEBHOOK_TOKEN_CLIENT_SECRET }}
  UTP_WEBHOOK_TOKEN_URL: ${{ vars.UTP_WEBHOOK_TOKEN_URL }}
  PTV_API_URL: "https://api.palvelutietovaranto.trn.suomi.fi/api"
  PTV_TOKEN_URL: "https://palvelutietovaranto.trn.suomi.fi/api/auth/api-login"
  PTV_SERVICE_URL: "https://api.palvelutietovaranto.trn.suomi.fi/api/v11/Service"
  PTV_SERVICE_LOCATION_URL: "https://api.palvelutietovaranto.trn.suomi.fi/api/v11/ServiceChannel/ServiceLocation"
  PTV_ORG_ID: "52e0f6dc-ec1f-48d5-a0a2-7a4d8b657d53"
  PTV_API_USERNAME: ${{ vars.PTV_API_USERNAME }}
  PTV_API_PASSWORD: ${{ secrets.PTV_API_PASSWORD }}
  OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT }}

jobs:
  # Format and lint. Needs no services, no JVM and no dependency download:
  # clj-kondo, cljfmt and bb are all GraalVM binaries, and the per-library
  # clj-kondo configs under webapp/.clj-kondo/<lib>/ are committed. Verified
  # that a cold clone with no .clj-kondo/.cache reports exactly the same
  # result as a warm local checkout, so `bb init-lint` is not needed here.
  #
  # Versions are pinned so CI and developer machines cannot disagree about
  # what "formatted" means. Bump them together with the local toolchain.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: 1.12.217
          clj-kondo: 2026.07.24
          cljfmt: 0.16.5

      # Formatting must match webapp/.cljfmt.edn exactly.
      - name: Check formatting
        run: bb fmt-check

      # Warnings fail too. The repository is at zero clj-kondo warnings and the
      # point of this gate is to keep it there — a warning ratchet against the
      # merge base was needed only while ~480 legacy warnings still existed.
      - name: Lint
        run: bb lint-strict

  # Backend tests need postgres + elasticsearch, so they run via
  # docker compose like before.
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run backend tests
        run: docker compose run --rm backend-tests

      - name: docker logs
        if: ${{ failure() }}
        run: docker compose logs

  # Builds need no services - run them on the host runner in parallel with
  # the tests. The shared composite action is the SAME build the deploy
  # workflows ship, so "CI is green" always means "the deployable artifacts
  # build" (upload is skipped here — deploy workflows build their own ref).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build release artifacts
        uses: ./.github/actions/build-artifacts
        with:
          upload: 'false'
